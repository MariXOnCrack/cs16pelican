name: Build and push egg image

on:
  push:
    branches: [main]
    paths: [Dockerfile, entrypoint.sh, .github/workflows/image.yml]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # weekly, picks up upstream image updates

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/386
          push: true
          tags: ghcr.io/marixoncrack/cs16-web-pelican:latest
